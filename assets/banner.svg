<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1) translate(0, 0); }
        50% { opacity: 0.65; transform: scale(1.1) translate(-20px, 15px); }
      }
      @keyframes pulseOrb2 {
        0%, 100% { opacity: 0.3; transform: scale(1) translate(0, 0); }
        50% { opacity: 0.6; transform: scale(1.15) translate(25px, -15px); }
      }
      @keyframes signStroke {
        0% { stroke-dashoffset: 800; opacity: 0.2; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.8; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes verifiedPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #10b981); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 10px #34d399); }
      }

      .orb-1 { animation: pulseGlow 10s ease-in-out infinite; transform-origin: center; }
      .orb-2 { animation: pulseOrb2 12s ease-in-out infinite; transform-origin: center; }
      .sign-path {
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: signStroke 6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }
      .float-1 { animation: floatSlow1 5s ease-in-out infinite; }
      .float-2 { animation: floatSlow2 6s ease-in-out infinite; }
      .verified-badge { animation: verifiedPulse 4s ease-in-out infinite; transform-origin: 1040px 175px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
      .text-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Background Glow Orbs -->
  <g class="orb-1">
    <circle cx="220" cy="90" r="180" fill="#38bdf8" opacity="0.18" filter="url(#glow)" />
  </g>
  <g class="orb-2">
    <circle cx="980" cy="270" r="190" fill="#818cf8" opacity="0.22" filter="url(#glow)" />
    <circle cx="600" cy="340" r="140" fill="#c084fc" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Left Dynamic Element: Document with Field Placement -->
  <g class="float-1" transform="translate(60, 80)">
    <rect width="110" height="150" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Mini Document lines -->
    <line x1="16" y1="24" x2="60" y2="24" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="16" y1="40" x2="94" y2="40" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    <line x1="16" y1="52" x2="85" y2="52" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    <line x1="16" y1="64" x2="90" y2="64" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Visual Fillable Field Box -->
    <rect x="14" y="80" width="82" height="24" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="20" y="95" fill="#38bdf8" font-size="9" font-family="monospace">Signature Field</text>
    
    <!-- Mini Checkbox and Date Field -->
    <rect x="14" y="114" width="10" height="10" rx="2" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path d="M16 119 l2 2 l4 -4" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="120" x2="94" y2="120" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Right Dynamic Element: Verified Seal & Cryptographic Lock -->
  <g class="verified-badge">
    <g transform="translate(1000, 130)">
      <circle cx="45" cy="45" r="45" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" filter="url(#shadow)"/>
      <circle cx="45" cy="45" r="37" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="1" stroke-dasharray="4,2"/>
      <!-- Shield / Checkmark -->
      <path d="M45 23 L62 30 C62 48 45 61 45 61 C45 61 28 48 28 30 Z" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" stroke-linejoin="round"/>
      <path d="M37 42 L43 48 L54 36" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Text around badge -->
      <text x="45" y="77" fill="#6ee7b7" font-size="8" text-anchor="middle" font-family="sans-serif" font-weight="bold" letter-spacing="0.5">CRYPTOGRAPHICALLY VERIFIED</text>
    </g>
  </g>

  <!-- Top Floating Feature Badges (Safe margin y=26, away from center title) -->
  <g class="float-1" transform="translate(230, 26)">
    <rect width="130" height="26" rx="13" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8"/>
    <text x="25" y="17" fill="#e2e8f0" class="text-pill">📝 PDF Form Builder</text>
  </g>

  <g class="float-2" transform="translate(420, 26)">
    <rect width="135" height="26" rx="13" fill="rgba(30, 41, 59, 0.85)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="13" r="4" fill="#818cf8"/>
    <text x="25" y="17" fill="#e2e8f0" class="text-pill">🔒 Self-Hosted Privacy</text>
  </g>

  <g class="float-1" transform="translate(615, 26)">
    <rect width="145" height="26" rx="13" fill="rgba(30, 41, 59, 0.85)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="13" r="4" fill="#c084fc"/>
    <text x="25" y="17" fill="#e2e8f0" class="text-pill">📜 Legal eIDAS &amp; ESIGN</text>
  </g>

  <g class="float-2" transform="translate(820, 26)">
    <rect width="150" height="26" rx="13" fill="rgba(30, 41, 59, 0.85)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="25" y="17" fill="#e2e8f0" class="text-pill">✨ Automated Workflows</text>
  </g>

  <!-- Center Animated Signature Wave (Runs under the title separator, visible and beautiful) -->
  <g transform="translate(360, 218)">
    <!-- Base track line -->
    <line x1="0" y1="20" x2="480" y2="20" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
    <!-- Animated Signature Stroke -->
    <path class="sign-path" d="M 10 20 Q 30 -5 50 15 T 80 5 T 120 22 Q 140 -15 160 18 Q 185 28 210 10 T 260 22 Q 290 -8 320 18 T 370 12 Q 410 2 450 18 L 470 20"
          fill="none" stroke="url(#titleGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="470" cy="20" r="3" fill="#c084fc" />
  </g>

  <!-- FOREGROUND TEXT (Strictly centered and layered on top) -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <!-- Category Mini-Tag -->
    <text x="0" y="-22" fill="#38bdf8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" letter-spacing="2.5">
      CURATED TECH DIRECTORY &amp; ARCHITECTURE GUIDE
    </text>

    <!-- Main Title -->
    <text x="0" y="24" fill="url(#titleGrad)" font-size="38" class="text-title" filter="url(#shadow)" letter-spacing="-0.5">
      Awesome Form Filling &amp; E-Signature
    </text>

    <!-- Subtitle -->
    <text x="0" y="60" fill="#cbd5e1" font-size="15.5" class="text-sub" filter="url(#shadow)">
      Self-Hosted Platforms • Visual Form Builders • Cryptographic PDF Verification • Cloud SaaS
    </text>
  </g>

  <!-- Bottom Badges / Tech Row (Safe margin y=298) -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <rect x="-370" y="-18" width="740" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="#334155" stroke-width="1"/>
    <text x="0" y="4" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500">
      ⚡ <tspan fill="#e2e8f0" font-weight="600">DocuSeal</tspan> • <tspan fill="#e2e8f0" font-weight="600">Documenso</tspan> • <tspan fill="#e2e8f0" font-weight="600">OpenSign</tspan> • <tspan fill="#e2e8f0" font-weight="600">Stirling-PDF</tspan> • <tspan fill="#e2e8f0" font-weight="600">LibreSign</tspan> • <tspan fill="#e2e8f0" font-weight="600">DocuSign</tspan> • <tspan fill="#e2e8f0" font-weight="600">Adobe Sign</tspan>
    </text>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
</svg>
